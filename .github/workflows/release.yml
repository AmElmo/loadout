name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - runner: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux (x86_64)
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x86_64)

    name: Build - ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: pnpm install --frozen-lockfile

      - name: Load release notes
        id: release_notes
        shell: bash
        run: |
          NOTES_FILE=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            # Use a delimiter to handle multiline content
            echo "body<<RELEASE_NOTES_EOF" >> "$GITHUB_OUTPUT"
            cat "$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "RELEASE_NOTES_EOF" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "body=See [CHANGELOG.md](https://github.com/AmElmo/loadout/blob/main/CHANGELOG.md) for the full history." >> "$GITHUB_OUTPUT"
          fi

      - name: Import Apple certificate
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Decode certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add keychain to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Verify signing identity is available
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin'
        env:
          KEYCHAIN_PATH: ${{ runner.temp }}/app-signing.keychain-db
        run: security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Verify Apple notarization access
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" > /tmp/notary-history.txt
          head -n 20 /tmp/notary-history.txt

      - uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Loadout ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --verbose

      - uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa # v0
        if: matrix.target != 'aarch64-apple-darwin' && matrix.target != 'x86_64-apple-darwin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Loadout ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --verbose
          retryAttempts: 2

      - name: Inspect recent notarization submissions
        if: failure() && (matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" | head -n 40 || true

  validate-updater:
    name: Validate updater metadata
    runs-on: ubuntu-22.04
    needs: build
    permissions:
      contents: read

    steps:
      - name: Validate latest.json on draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["GITHUB_REF_NAME"]
          token = os.environ["GITHUB_TOKEN"]
          api_base = f"https://api.github.com/repos/{repo}"
          expected_platform_prefixes = [
              "darwin-aarch64",
              "darwin-x86_64",
              "linux-x86_64",
              "windows-x86_64",
          ]

          def fetch_json(url: str):
              req = Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(req) as resp:
                  return json.load(resp)

          def fetch_bytes(url: str) -> bytes:
              req = Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/octet-stream",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(req) as resp:
                  return resp.read()

          release = None
          for attempt in range(10):
              try:
                  release = fetch_json(f"{api_base}/releases/tags/{tag}")
              except HTTPError as exc:
                  if exc.code != 404 or attempt == 9:
                      raise
                  time.sleep(10)
                  continue

              asset_names = {asset["name"] for asset in release.get("assets", [])}
              if "latest.json" in asset_names:
                  break
              if attempt == 9:
                  break
              time.sleep(10)

          if release is None:
              raise SystemExit(f"Could not find release for tag {tag}")

          assets = release.get("assets", [])
          asset_names = sorted(asset["name"] for asset in assets)
          print("Release assets:")
          for name in asset_names:
              print(f"  - {name}")

          latest_asset = next((asset for asset in assets if asset["name"] == "latest.json"), None)
          if latest_asset is None:
              raise SystemExit("latest.json is missing from the release assets")

          latest_json = json.loads(fetch_bytes(latest_asset["url"]).decode("utf-8"))
          platforms = latest_json.get("platforms")
          if not isinstance(platforms, dict):
              raise SystemExit("latest.json is missing a valid platforms object")

          missing = []
          invalid = []
          for prefix in expected_platform_prefixes:
              matches = [
                  (key, value)
                  for key, value in platforms.items()
                  if key == prefix or key.startswith(prefix + "-")
              ]
              if not matches:
                  missing.append(prefix)
                  continue

              for key, value in matches:
                  if not isinstance(value, dict):
                      invalid.append(f"{key}: entry is not an object")
                      continue
                  if not value.get("url"):
                      invalid.append(f"{key}: missing url")
                  if not value.get("signature"):
                      invalid.append(f"{key}: missing signature")

          version = latest_json.get("version")
          if not isinstance(version, str) or not version.strip():
              invalid.append("top-level version is missing")

          if missing or invalid:
              if missing:
                  print("Missing platforms:")
                  for item in missing:
                      print(f"  - {item}")
              if invalid:
                  print("Invalid platform entries:")
                  for item in invalid:
                      print(f"  - {item}")
              raise SystemExit("Updater metadata validation failed")

          print("Validated latest.json successfully.")
          print(f"Version: {version}")
          print("Platforms:")
          for key in sorted(platforms):
              print(f"  - {key}")
          PY
