  <text x="450" y="268" font-family="'Space Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="400" font-size="18" letter-spacing="1" fill="#94A3B8" text-anchor="middle">Gear up your AI tools</text>

