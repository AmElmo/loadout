model = "o3"
approval_policy = "on-request"

[mcp_servers.postgres]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres", "postgresql://localhost:5432/acme_dev"]

[mcp_servers.slack]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-slack"]

[mcp_servers.slack.env]
SLACK_BOT_TOKEN = "xoxb-FAKE-TOKEN-FOR-TESTING"
SLACK_TEAM_ID = "T01ACME"

[mcp_servers.redis]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-redis", "redis://localhost:6379"]

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]

[mcp_servers.github.env]
GITHUB_TOKEN = "ghp_FAKE_TOKEN_FOR_TESTING_000"
